name: Headless core on Ubuntu 22.04
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash -n splat scripts/build-native-linux.sh scripts/setup-engines-linux.sh scripts/verify-engines-linux.sh
      - run: python3 -m unittest discover -s tests -v
      - run: npm run test:engine-scripts
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml system_ffprobe_reads_video_and_rotation -- --ignored
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml --bin splatstudio
      - uses: actions/upload-artifact@v4
        with:
          name: headless-core-ubuntu22.04
          path: src-tauri/target/release/splatstudio
